[project]
name = "redacto"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zaid", email = "zaid@redacto.ai" }
]
requires-python = ">=3.11"
dependencies = [
    "cloudevents>=1.12.0",
    "pika>=1.3.2",
    "pydantic>=2.11.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"
